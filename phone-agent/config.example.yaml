# On-device agent config — COPY to config.yaml and fill in real values.
# NEVER commit config.yaml. This file is the template only.

agent:
  # Vercel-deployed web app
  cloud_base_url: "https://YOUR-APP.vercel.app"
  bearer_token: "REPLACE_WITH_AGENT_TOKEN"   # from secrets store, not git

  # Long-poll hold: how long the server may hold our open request.
  # Keep ~5s under the Vercel function duration cap (Hobby = 60s).
  events_hold_seconds: 45
  # When Vercel returns a held empty response, reconnect immediately.
  reconnect_delay_seconds: 2

  # Run flow settings
  verify_retries: 2
  shield_min_remaining_hours: 24   # idempotency guard

device:
  # Automation surface (the app is driven on-device now, not over USB)
  hermes_touch_url: "http://127.0.0.1:8887"
  # Bundle id of Evony (set from the installed app)
  evony_bundle_id: "com.xxx.evony"

vision:
  calibration_dir: "calibration"   # reference screenshots + ROI maps
  tesseract_cmd: "/usr/local/bin/tesseract"   # on-device path (Procursus: /var/jb/usr/bin/tesseract)
  enabled: true                    # set false until calibration images exist (no-verify mode)

logging:
  level: "INFO"