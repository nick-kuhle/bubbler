# On-device agent config — COPY to config.yaml and fill in real values.
# NEVER commit config.yaml. This file is the template only.

cloud:
  base_url: https://bubbler.vercel.app
  agent_token: ""          # long-lived bearer, minted by the master
  max_idle_sec: 300        # watchdog: exit if no poll round completes for this long
  max_failures: 8          # watchdog: exit after this many consecutive cloud poll failures

phone:
  evony_bundle_id: com.topgamesinc.evony   # UPDATE once installed; capture via ideviceinstaller
  frida_host: 127.0.0.1                    # local frida-server on the phone
  frida_port: 27042
  zxtouch_host: 127.0.0.1                 # ZXTouch rootless socket
  zxtouch_port: 6000
  zxtouch_template_dir: /var/jb/usr/libexec/bubbler/calibration
  # Laptop-mode bridge to the phone's SSH (kill/relaunch Evony). On the phone
  # (cutover) leave these empty/unset so the agent uses local uiopen/killall.
  ssh_host: ""                # e.g. 192.168.x.x when the brain runs on this laptop
  ssh_user: mobile
  ssh_key: ~/.ssh/bubbler_phone_ed25519
  # Root key for the ONE job that needs uid 0: starting frida-server, which ptraces
  # the game. The jailbreak's sudo asks for a password, so key-based root SSH is the
  # only unattended option. Authorize the same public key in the phone's root
  # authorized_keys (on Dopamine: /var/jb/var/root/.ssh/authorized_keys — that is the
  # home `getent passwd root` reports, not /var/root). Leave empty to disable: the
  # repair then reports frida as needing a manual start instead of silently failing.
  root_ssh_user: root
  root_ssh_key: ~/.ssh/bubbler_phone_ed25519

vision:
  enabled: false                  # set true after calibration assets are captured
  tesseract_cmd: tesseract

calibration:
  enabled: true
  manifest: calibration/calibration.json
  directory: calibration

schedule:
  slots:                   # per-slot model — each day its own time, UTC
    - weekday: 1          # Mon
      time: "09:00"
    - weekday: 3          # Wed
      time: "09:00"
    - weekday: 5          # Fri
      time: "18:00"
  shield_hours: 72        # 3-day = 2,500 gems; 24h = 1,000

runner:
  timeout_run_ms: 120000
  poll_interval_ms: 3000
