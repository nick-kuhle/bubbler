# On-device agent config — COPY to config.yaml and fill in real values.
# NEVER commit config.yaml. This file is the template only.

cloud:
  base_url: https://bubbler.vercel.app
  agent_token: ""          # long-lived bearer, minted by the master

phone:
  evony_bundle_id: com.topgamesinc.evony   # UPDATE once installed; capture via ideviceinstaller

schedule:
  slots:                   # per-slot model — each day its own time, UTC
    - weekday: 1          # Mon
      time: "09:00"
    - weekday: 3          # Wed
      time: "09:00"
    - weekday: 5          # Fri
      time: "18:00"
  shield_hours: 72        # 3-day = 2,500 gems; 24h = 1,000

runner:
  timeout_run_ms: 120000
  poll_interval_ms: 3000