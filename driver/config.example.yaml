# Home agent config — COPY to config.yaml and fill in real values.
# NEVER commit config.yaml. This file is the template only.

agent:
  poll_interval_seconds: 60
  run_lock_timeout_seconds: 900
  verify_retries: 2
  # cloud API the agent polls; set base URL for the Vercel/self-hosted app
  cloud_base_url: "https://YOUR-APP.vercel.app"
  bearer_token: "REPLACE_WITH_AGENT_TOKEN"   # from secrets store, not git

device:
  # USB transport (working today): usbmuxd + iproxy -> SSH
  ssh_port: 4044
  ssh_user: "mobile"
  ssh_pass: "REPLACE"                        # Dopamine user password (via secrets)
  ssh_private_key: ""                        # optional: prefer key auth
  # Hermes Touch HTTP (target automation layer; pending rootless verification)
  hermes_touch_url: "http://127.0.0.1:8887"
  hermes_touch_enabled: false

vision:
  calibration_dir: "calibration"             # reference screenshots + ROI maps
  shield_min_remaining_hours: 24             # idempotency guard
  tesseract_cmd: "/usr/bin/tesseract"

evony:
  # per-account link info is NOT stored here — the agent fetches per-job details
  # from the cloud (/jobs/due). Keep this file account-free.
  orientation_locked: true
  close_after_run: true